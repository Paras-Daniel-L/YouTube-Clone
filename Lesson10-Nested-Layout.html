<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson10-Nested-Layout
    </title>
    <link rel="stylesheet" href="styles/lesson10/Lesson10-Nested-Layout.css">

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <input class="search-bar" type="text" placeholder="Search">
    <div class="video">
      <div class="video-div">
        <img class="thumbnail" src="https://supersimple.dev/exercises/youtube/thumbnails/thumbnail-1.webp" alt="Thumbnail">
      </div>
      <div class="info-div">
        <div class="profile-div">
          <img class="profile" src="https://supersimple.dev/exercises/youtube/channel-profile-pics/channel-1.jpeg" alt="Profile">
        </div>
        <div class="text-div">
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
          <p class="video-author">
            Marques Brownlee
          </p>
          <p class="video-stats">
            3.4M views &#183; 6 months ago
          </p>
        </div>
      </div>
    </div>

    <div class="video-2">
      <div class="video-div">
        <img class="thumbnail" src="https://supersimple.dev/exercises/youtube/thumbnails/thumbnail-2.webp" alt="Thumnail">
      </div>
      <div class="info-div">
        <div class="profile-div">
          <img class="profile" src="https://supersimple.dev/exercises/youtube/channel-profile-pics/channel-2.jpeg" alt="Profile">
        </div>
        <div class="text-div">
          <p class="video-title">
            Try Not To Laugh Challenge #9
          </p>
          <p class="video-author">
            Markiplier
          </p>
          <p class="video-stats">
            19M views &#183; 4 years agos
          </p>
        </div>
      </div>
    </div>

  </body>
</html>
